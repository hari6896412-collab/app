<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Events</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="header-left">
      <h1>GSB</h1>
      <a href="/dashboard.html" class="nav-btn">Dashboard</a>
      <a href="/funds.html" class="nav-btn">Funds</a>
      <a href="/reports.html" class="nav-btn">Reports</a>
      <a href="/major-donations.html" class="nav-btn">₹10,000+ Donations</a>
      <a href="/upload-event.html" class="nav-btn admin-btn" id="uploadNavBtn" style="display: none;">+ Upload Event</a>
    </div>
    <div class="user-info">
      <span class="user-pill" id="userLabel"></span>
      <button class="btn-logout" id="logoutBtn">Logout</button>
    </div>
  </header>

  <div class="container">
    <!-- Separate Subtotal Event Banner -->
    <div class="subtotal-card">
      <div>
        <h2>Subtotal (Total Funds)</h2>
        <p class="subtotal-sub" id="subtotalMeta">Updated automatically from all donations</p>
      </div>
      <div class="subtotal-amount" id="subtotalAmount">₹0</div>
    </div>

    <div class="section" style="margin-bottom: 24px;">
      <div class="section-head">
        <h2>Community Events</h2>
        <span class="total-pill" id="eventCount">0 Events</span>
      </div>
      <p class="hint" style="margin-bottom: 0;">Latest announcements, stories, photos, and funds raised per event.</p>
      <div id="eventsMsg" class="message"></div>
    </div>

    <div id="eventsFeed"></div>
  </div>

  <script>
    const token = localStorage.getItem('token');
    const accessLevel = Number(localStorage.getItem('access_level'));
    const username = localStorage.getItem('username');

    if (!token) {
      window.location.href = '/index.html';
    }

    document.getElementById('userLabel').textContent = `${username} · L${accessLevel}`;
    document.getElementById('logoutBtn').addEventListener('click', logout);

    if (accessLevel === 1) {
      document.getElementById('uploadNavBtn').style.display = 'inline-block';
    }

    function logout() {
      localStorage.clear();
      window.location.href = '/index.html';
    }

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function formatRupees(val) {
      return '₹' + Number(val || 0).toLocaleString('en-IN');
    }

    function formatDate(sqlDate) {
      if (!sqlDate) return '';
      const d = new Date(sqlDate.replace(' ', 'T') + 'Z');
      return isNaN(d) ? sqlDate : d.toLocaleDateString('en-IN', {
        day: '2-digit',
        month: 'short',
        year: 'numeric',
      });
    }

    function renderBlocks(blocks) {
      return blocks.map((b) => {
        if (b.type === 'heading') {
          return `<h3 class="article-heading">${escapeHtml(b.content)}</h3>`;
        }
        if (b.type === 'text') {
          return `<p class="article-text">${escapeHtml(b.content)}</p>`;
        }
        if (b.type === 'image' && b.url && b.url.startsWith('/uploads/')) {
          const captionHtml = b.caption
            ? `<figcaption>${escapeHtml(b.caption)}</figcaption>`
            : '';
          return `
            <figure class="article-figure">
              <img src="${escapeHtml(b.url)}" alt="${escapeHtml(b.caption || 'Event photo')}" />
              ${captionHtml}
            </figure>
          `;
        }
        return '';
      }).join('');
    }

    async function loadEvents() {
      const feed = document.getElementById('eventsFeed');
      const countEl = document.getElementById('eventCount');
      const subtotalEl = document.getElementById('subtotalAmount');
      const subtotalMeta = document.getElementById('subtotalMeta');
      const msg = document.getElementById('eventsMsg');
      msg.className = 'message';

      try {
        const res = await fetch('/api/events', {
          headers: { Authorization: `Bearer ${token}` },
        });

        if (res.status === 401) return logout();
        const data = await res.json();

        if (!res.ok) {
          msg.textContent = data.error || 'Could not load events';
          msg.className = 'message error';
          return;
        }

        const totalAll = data.subtotal ? data.subtotal.total_fund : 0;
        const generalFund = data.general_fund || 0;
        subtotalEl.textContent = formatRupees(totalAll);
        subtotalMeta.textContent = `General Donations: ${formatRupees(generalFund)}  ·  Event Donations: ${formatRupees(totalAll - generalFund)}`;

        countEl.textContent = `${data.count} ${data.count === 1 ? 'Event' : 'Events'}`;

        if (data.events.length === 0) {
          feed.innerHTML = `
            <div class="section welcome-box">
              <h2>No Events Yet!</h2>
              <p class="hint" style="margin-bottom: 0;">
                ${accessLevel === 1
                  ? 'Click "+ Upload Event" above to publish the first article.'
                  : 'Check back soon for upcoming events and stories.'}
              </p>
            </div>
          `;
          return;
        }

        feed.innerHTML = data.events.map((ev) => {
          const eventDateTag = ev.event_date
            ? `<span class="meta-tag date-tag">Event Date: ${escapeHtml(ev.event_date)}</span>`
            : '';
          const deleteBtn = accessLevel === 1
            ? `<button class="btn-reject" onclick="deleteEvent(${ev.id})">Delete</button>`
            : '';

          return `
            <article class="event-card">
              <div class="event-header">
                <div>
                  <h2 class="event-title">${escapeHtml(ev.title)}</h2>
                  <div class="event-meta">
                    <span class="meta-tag fund-tag">Total Fund: ${formatRupees(ev.total_fund)}</span>
                    <span class="meta-tag">By ${escapeHtml(ev.author)}</span>
                    ${eventDateTag}
                    <span class="meta-tag">Posted ${formatDate(ev.created_at)}</span>
                  </div>
                </div>
                ${deleteBtn}
              </div>
              <div class="article-body">
                ${renderBlocks(ev.blocks || [])}
              </div>
            </article>
          `;
        }).join('');
      } catch {
        msg.textContent = 'Could not connect to server.';
        msg.className = 'message error';
      }
    }

    async function deleteEvent(id) {
      if (!confirm('Delete this event article?')) return;

      const res = await fetch(`/api/events/${id}`, {
        method: 'DELETE',
        headers: { Authorization: `Bearer ${token}` },
      });

      if (res.status === 401) return logout();
      loadEvents();
    }

    loadEvents();
  </script>
  <script src="nav.js"></script>
</body>
</html>s
