<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up</title>
  <link rel="stylesheet" href="/style.css" />
  <script src="/theme.js"></script>
</head>
<body class="center-page">
  <div class="card">
    <h2>Join In!</h2>
    <p class="hint">All fields below are mandatory. You will receive a unique ID number to sign in.</p>

    <form id="signupForm">
      <label for="username">Username</label>
      <input type="text" id="username" placeholder="Pick a username" required autocomplete="username" />

      <label for="email">Email</label>
      <input type="email" id="email" placeholder="you@example.com" required autocomplete="email" />

      <label for="password">Password</label>
      <div class="password-wrap">
        <input type="password" id="password" placeholder="Create password" required autocomplete="new-password" />
        <button type="button" class="toggle-pw" onclick="togglePassword('password', this)">Show</button>
      </div>

      <label for="confirmPassword">Confirm Password</label>
      <div class="password-wrap">
        <input type="password" id="confirmPassword" placeholder="Repeat password" required autocomplete="new-password" />
        <button type="button" class="toggle-pw" onclick="togglePassword('confirmPassword', this)">Show</button>
      </div>

      <label for="centreSelect">Your Centre</label>
      <select id="centreSelect" required>
        <option value="">Loading centres…</option>
      </select>
      <p class="hint" style="margin: 6px 0 0;">Your donations go to this centre, and its admins approve your account.</p>

      <!-- Dynamic typed columns & dropdowns added by Level 0 load here automatically -->
      <div id="customFieldsContainer"></div>

      <button type="submit" class="btn-full">Sign Up</button>
      <div id="signupMsg" class="message"></div>
    </form>

    <div id="assignedIdBox" class="id-highlight-box" style="display: none;"></div>

    <p class="auth-switch">
      Already have an account? <a href="/index.html">Sign In</a>
    </p>
  </div>

  <script>
    if (localStorage.getItem('token')) {
      window.location.href = '/';
    }

    let customColumns = [];

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function togglePassword(inputId, btn) {
      const input = document.getElementById(inputId);
      const isHidden = input.type === 'password';
      input.type = isHidden ? 'text' : 'password';
      btn.textContent = isHidden ? 'Hide' : 'Show';
    }

    async function loadCentres() {
      const sel = document.getElementById('centreSelect');
      try {
        const res = await fetch('/api/centres/public');
        const data = await res.json();
        const groups = new Map();
        for (const c of data.centres || []) {
          const key = `${c.region_name} › ${c.zone_name}`;
          if (!groups.has(key)) groups.set(key, []);
          groups.get(key).push(c);
        }
        sel.innerHTML = '<option value="">-- Select your centre --</option>' +
          Array.from(groups).map(([label, list]) =>
            `<optgroup label="${escapeHtml(label)}">${list.map((c) =>
              `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('')}</optgroup>`).join('');
        if ((data.centres || []).length === 1) sel.value = String(data.centres[0].id);
      } catch {
        sel.innerHTML = '<option value="">Could not load centres</option>';
      }
    }
    loadCentres();

    async function loadCustomUserColumns() {
      const container = document.getElementById('customFieldsContainer');
      try {
        const res = await fetch('/api/schema/users');
        if (!res.ok) return;
        const data = await res.json();
        customColumns = data.columns || [];

        container.innerHTML = customColumns.map((col) => {
          const type = col.data_type || 'text';
          const fieldId = `custom_${escapeHtml(col.column_name)}`;
          const req = col.is_required ? 'required' : '';
          let inputHtml = '';

          if (type === 'select') {
            const opts = Array.isArray(col.options) ? col.options : [];
            inputHtml = `
              <select id="${fieldId}" data-col="${escapeHtml(col.column_name)}" ${req}>
                <option value="">-- Select ${escapeHtml(col.display_label)} --</option>
                ${opts.map((opt) => `<option value="${escapeHtml(opt)}">${escapeHtml(opt)}</option>`).join('')}
              </select>
            `;
          } else if (type === 'boolean') {
            inputHtml = `
              <select id="${fieldId}" data-col="${escapeHtml(col.column_name)}" ${req}>
                <option value="">-- Select Yes or No --</option>
                <option value="Yes">Yes</option>
                <option value="No">No</option>
              </select>
            `;
          } else {
            const stepAttr = type === 'number' ? ' step="any"' : '';
            inputHtml = `
              <input
                type="${escapeHtml(type)}"${stepAttr}
                id="${fieldId}"
                data-col="${escapeHtml(col.column_name)}"
                placeholder="Enter ${escapeHtml(col.display_label)}${col.is_required ? '' : ' (optional)'}"
                ${req}
              />
            `;
          }

          return `
            <label for="${fieldId}">${escapeHtml(col.display_label)}${col.is_required
              ? ' <span style="color:#b91c1c;" title="Required">*</span>'
              : ' <span class="stat-sub">(optional)</span>'}</label>
            ${inputHtml}
          `;
        }).join('');
      } catch {}
    }

    const form = document.getElementById('signupForm');
    const msg = document.getElementById('signupMsg');
    const idBox = document.getElementById('assignedIdBox');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.className = 'message';
      idBox.style.display = 'none';

      const username = document.getElementById('username').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const centre_id = Number(document.getElementById('centreSelect').value);

      if (password !== confirmPassword) {
        msg.textContent = 'Passwords do not match.';
        msg.className = 'message error';
        return;
      }

      const custom_fields = {};
      for (const col of customColumns) {
        const input = document.getElementById(`custom_${col.column_name}`);
        const val = input ? input.value.trim() : '';
        if (!val) {
          msg.textContent = `${col.display_label} is mandatory.`;
          msg.className = 'message error';
          return;
        }
        custom_fields[col.column_name] = val;
      }

      try {
        const res = await fetch('/api/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, email, password, centre_id, custom_fields }),
        });

        const data = await res.json();

        if (!res.ok) {
          msg.textContent = data.error || 'Sign up failed';
          msg.className = 'message error';
          return;
        }

        msg.textContent = data.message;
        msg.className = 'message success';
        idBox.innerHTML = `Your Login ID Number: <span>${data.login_id}</span>`;
        idBox.style.display = 'block';
        form.reset();
      } catch {
        msg.textContent = 'Could not connect to server.';
        msg.className = 'message error';
      }
    });

    loadCustomUserColumns();
  </script>
</body>
</html>
