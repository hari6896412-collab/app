<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Community Funds</title>
  <link rel="stylesheet" href="/style.css" />
  <script src="/theme.js"></script>
</head>
<body>
  <header></header>

  <div class="container">
    <div class="section">
      <div class="section-head">
        <h2>Event Funds</h2>
        <span class="total-pill" id="eventCount">…</span>
      </div>
      <p class="hint">Transparency ledger for members — money raised by each event, grouped by centre.</p>

      <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
        <label for="centreFilter" style="margin:0;">Centre</label>
        <select id="centreFilter" style="max-width: 340px;"></select>
      </div>
      <div id="fundsMsg" class="message"></div>
    </div>

    <div id="fundsGroups"></div>
  </div>

  <script>
    function escapeHtml(str) {
      return String(str ?? '-')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function formatRupees(val) {
      return '₹' + Number(val || 0).toLocaleString('en-IN');
    }

    const token = localStorage.getItem('token');
    if (!token) window.location.href = '/index.html';

    let events = [];

    function render() {
      const filter = document.getElementById('centreFilter').value;
      const list = events.filter((ev) => filter === 'all' || String(ev.centre_id) === filter);
      document.getElementById('eventCount').textContent = `${list.length} ${list.length === 1 ? 'event' : 'events'}`;

      const groups = new Map();
      for (const ev of list) {
        const key = ev.centre_id ?? 'none';
        if (!groups.has(key)) groups.set(key, { ev, items: [] });
        groups.get(key).items.push(ev);
      }

      const holder = document.getElementById('fundsGroups');
      if (!list.length) {
        holder.innerHTML = '<div class="section welcome-box"><h2>No events yet</h2><p class="hint" style="margin:0;">Funds raised by events will appear here.</p></div>';
        return;
      }

      holder.innerHTML = Array.from(groups.values()).map(({ ev, items }) => `
        <div class="section" style="margin-top: 20px;">
          <div class="section-head">
            <h3>${escapeHtml(ev.centre_name || 'Unassigned centre')}</h3>
            <span class="stat-sub">${escapeHtml([ev.zone_name, ev.region_name].filter(Boolean).join(' · '))}</span>
          </div>
          <div class="table-wrap" style="margin-top: 10px;">
            <table>
              <thead>
                <tr>
                  <th>Event</th>
                  <th>Event Date</th>
                  <th>Funds Raised</th>
                </tr>
              </thead>
              <tbody>
                ${items.map((e) => `
                  <tr>
                    <td><span class="event-tag-badge">${escapeHtml(e.title)}</span></td>
                    <td>${escapeHtml(e.event_date || '—')}</td>
                    <td class="amount-cell">${formatRupees(e.total_fund)}</td>
                  </tr>`).join('')}
              </tbody>
            </table>
          </div>
        </div>`).join('');
    }

    async function loadFunds() {
      const msg = document.getElementById('fundsMsg');
      msg.className = 'message';

      try {
        const res = await fetch('/api/funds', { headers: { Authorization: `Bearer ${token}` } });
        if (res.status === 401) {
          localStorage.clear();
          window.location.href = '/index.html';
          return;
        }
        const data = await res.json();

        if (!res.ok) {
          msg.textContent = data.error || 'Could not load funds';
          msg.className = 'message error';
          return;
        }

        events = data.events || [];
        const centres = new Map();
        for (const ev of events) if (ev.centre_id) centres.set(ev.centre_id, ev);
        const sel = document.getElementById('centreFilter');
        sel.innerHTML = '<option value="all">All centres</option>' +
          Array.from(centres.values())
            .map((ev) => `<option value="${ev.centre_id}">${escapeHtml(ev.centre_name)} (${escapeHtml(ev.zone_name)})</option>`)
            .join('');

        // Members start on their own centre
        const mine = localStorage.getItem('centre_id');
        if (mine && centres.has(Number(mine))) sel.value = mine;
        render();
      } catch {
        msg.textContent = 'Could not connect to server.';
        msg.className = 'message error';
      }
    }

    document.getElementById('centreFilter').addEventListener('change', render);
    loadFunds();
  </script>
  <script src="/nav.js"></script>
</body>
</html>
