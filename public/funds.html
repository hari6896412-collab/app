<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Community Funds</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header></header>

  <div class="container">
    <!-- Separate Subtotal Event Display -->
    <div class="subtotal-card">
      <div>
        <h2>Subtotal (All Funds)</h2>
        <p class="subtotal-sub" id="subtotalBreakdown">Combined total across General &amp; all events</p>
      </div>
      <div class="subtotal-amount" id="subtotalValue">₹0</div>
    </div>

    <!-- Breakdown by Event -->
    <div class="section">
      <h2>Event Funds</h2>
      <p class="hint">Public transparency ledger — visible to everyone.</p>
      <div id="fundsMsg" class="message"></div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Event / Cause</th>
              <th>Event Date</th>
              <th>Total Fund</th>
            </tr>
          </thead>
          <tbody id="fundsTableBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    function escapeHtml(str) {
      return String(str ?? '-')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function formatRupees(val) {
      return '₹' + Number(val || 0).toLocaleString('en-IN');
    }

    async function loadFunds() {
      const subtotalVal = document.getElementById('subtotalValue');
      const breakdown = document.getElementById('subtotalBreakdown');
      const tbody = document.getElementById('fundsTableBody');
      const msg = document.getElementById('fundsMsg');
      msg.className = 'message';

      try {
        const res = await fetch('/api/funds');
        const data = await res.json();

        if (!res.ok) {
          msg.textContent = data.error || 'Could not load funds';
          msg.className = 'message error';
          return;
        }

        const subtotalAmount = data.subtotal ? data.subtotal.total_fund : 0;
        const generalFund = data.general_fund || 0;
        const eventsOnly = subtotalAmount - generalFund;

        subtotalVal.textContent = formatRupees(subtotalAmount);
        breakdown.textContent = `General: ${formatRupees(generalFund)}  ·  Events: ${formatRupees(eventsOnly)}`;

        const rows = [];
        rows.push(`
          <tr>
            <td><span class="event-tag-badge general">General</span></td>
            <td>—</td>
            <td class="amount-cell">${formatRupees(generalFund)}</td>
          </tr>
        `);

        for (const ev of data.events) {
          rows.push(`
            <tr>
              <td><span class="event-tag-badge">${escapeHtml(ev.title)}</span></td>
              <td>${escapeHtml(ev.event_date || '—')}</td>
              <td class="amount-cell">${formatRupees(ev.total_fund)}</td>
            </tr>
          `);
        }

        tbody.innerHTML = rows.join('');
      } catch {
        msg.textContent = 'Could not connect to server.';
        msg.className = 'message error';
      }
    }

    loadFunds();
  </script>
  <script src="nav.js"></script>
</body>
</html>
