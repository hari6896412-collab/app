<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reports</title>
  <link rel="stylesheet" href="/style.css" />
  <script src="/theme.js"></script>
  <style>
    .report-list { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
    .report-row {
      display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
      padding: 14px 16px; border: 1px solid var(--border-color); border-radius: var(--radius-md);
      background: linear-gradient(180deg, #ffffff 0%, #fdfbfa 100%); box-shadow: var(--shadow-xs);
    }
    .report-icon {
      width: 42px; height: 42px; border-radius: 10px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
      background: var(--brand-gradient); color: #fff; font-weight: 800; font-size: 0.72rem; letter-spacing: 0.04em;
    }
    .report-main { flex: 1; min-width: 220px; }
    .report-name { font-weight: 700; font-size: 0.98rem; }
    .report-sub { font-size: 0.82rem; color: var(--muted); margin-top: 2px; }
    .report-row .report-actions button { margin-top: 0; }
  </style>
</head>
<body>
  <header></header>

  <div class="container">
    <div class="section">
      <div class="section-head">
        <h2>Financial Reports</h2>
        <span class="total-pill" id="reportCount">…</span>
      </div>
      <p class="hint" style="margin-bottom: 0;">
        Download a report to read it. You see reports that cover your centre, and admins also see every report in their area.
      </p>

      <div class="filter-bar" id="typeFilters">
        <button type="button" class="filter-btn active" data-type="">All</button>
        <button type="button" class="filter-btn" data-type="monthly">Monthly</button>
        <button type="button" class="filter-btn" data-type="quarterly">Quarterly</button>
        <button type="button" class="filter-btn" data-type="half_yearly">Half-yearly</button>
        <button type="button" class="filter-btn" data-type="yearly">Yearly</button>
        <button type="button" class="filter-btn" data-type="event">Event</button>
      </div>

      <div id="reportsMsg" class="message"></div>
      <div id="reportList" class="report-list"></div>
    </div>
  </div>

  <script>
    const token = localStorage.getItem('token');
    const accessLevel = Number(localStorage.getItem('access_level'));
    if (!token) window.location.href = '/index.html';

    const TYPE_LABELS = {
      monthly: 'Monthly', quarterly: 'Quarterly', half_yearly: 'Half-yearly', yearly: 'Yearly', event: 'Event',
    };

    let reports = [];
    let typeFilter = '';

    function logout() {
      localStorage.clear();
      window.location.href = '/index.html';
    }

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function formatDate(sqlDate) {
      const d = new Date(String(sqlDate).replace(' ', 'T') + 'Z');
      return isNaN(d) ? sqlDate : d.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
    }

    function showMsg(text, kind) {
      const m = document.getElementById('reportsMsg');
      m.textContent = text;
      m.className = `message ${kind || ''}`;
    }

    function render() {
      const list = reports.filter((r) => !typeFilter || r.report_type === typeFilter);
      document.getElementById('reportCount').textContent = `${list.length} ${list.length === 1 ? 'report' : 'reports'}`;
      const holder = document.getElementById('reportList');

      if (!list.length) {
        holder.innerHTML = `<p class="hint" style="margin: 6px 0 0;">${
          reports.length ? 'No reports of this type.'
            : accessLevel <= 3 ? 'No reports yet — generate one from your Dashboard.' : 'No reports have been shared with your centre yet.'
        }</p>`;
        return;
      }

      holder.innerHTML = list.map((r) => `
        <div class="report-row">
          <div class="report-icon">PDF</div>
          <div class="report-main">
            <div class="report-name">${escapeHtml(r.title)}</div>
            <div class="report-sub">
              ${escapeHtml(TYPE_LABELS[r.report_type] || r.report_type)} · ${escapeHtml(r.period_label)} ·
              📍 ${escapeHtml(r.scope_label || 'All centres')} · by ${escapeHtml(r.generated_by)} on ${formatDate(r.created_at)}
            </div>
          </div>
          <div class="report-actions">
            <button class="btn-approve btn-pdf" id="pdf-btn-${r.id}" onclick="downloadPdf(${r.id})">⬇ Download PDF</button>
            ${r.can_delete ? `<button class="btn-reject" onclick="deleteReport(${r.id})">Delete</button>` : ''}
          </div>
        </div>`).join('');
    }

    async function loadReports() {
      try {
        const res = await fetch('/api/reports', { headers: { Authorization: `Bearer ${token}` } });
        if (res.status === 401) return logout();
        const data = await res.json();
        if (!res.ok) return showMsg(data.error || 'Could not load reports', 'error');
        reports = data.reports || [];
        render();
      } catch {
        showMsg('Could not connect to server.', 'error');
      }
    }

    async function downloadPdf(id) {
      const btn = document.getElementById(`pdf-btn-${id}`);
      const original = btn.textContent;
      btn.disabled = true;
      btn.textContent = 'Preparing…';
      try {
        const res = await fetch(`/api/reports/${id}/pdf`, { headers: { Authorization: `Bearer ${token}` } });
        if (res.status === 401) return logout();
        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          throw new Error(data.error || 'Could not create the PDF');
        }
        const match = (res.headers.get('Content-Disposition') || '').match(/filename="([^"]+)"/);
        const url = URL.createObjectURL(await res.blob());
        const a = document.createElement('a');
        a.href = url;
        a.download = match ? match[1] : `report-${id}.pdf`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 10000);
      } catch (err) {
        showMsg(err.message, 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = original;
      }
    }

    async function deleteReport(id) {
      if (!confirm('Delete this report?')) return;
      const res = await fetch(`/api/reports/${id}`, { method: 'DELETE', headers: { Authorization: `Bearer ${token}` } });
      if (res.status === 401) return logout();
      const data = await res.json().catch(() => ({}));
      showMsg(res.ok ? data.message : data.error || 'Could not delete', res.ok ? 'success' : 'error');
      loadReports();
    }

    document.getElementById('typeFilters').addEventListener('click', (e) => {
      const btn = e.target.closest('[data-type]');
      if (!btn) return;
      typeFilter = btn.dataset.type;
      document.querySelectorAll('#typeFilters .filter-btn').forEach((b) => b.classList.toggle('active', b === btn));
      render();
    });

    loadReports();
  </script>
  <script src="/nav.js"></script>
</body>
</html>
