<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Financial Reports</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="header-left">
      <h1>GSB</h1>
      <a href="/dashboard.html" class="nav-btn">← Dashboard</a>
      <a href="/events.html" class="nav-btn">Events</a>
      <a href="/funds.html" class="nav-btn">Funds</a>
      <a href="/major-donations.html" class="nav-btn">₹10,000+ Donations</a>
      <a href="/upload-event.html" class="nav-btn admin-btn" id="uploadNavBtn" style="display: none;">+ Upload Event</a>
    </div>
    <div class="user-info">
      <span class="user-pill" id="userLabel"></span>
      <button class="btn-logout" id="logoutBtn">Logout</button>
    </div>
  </header>

  <div class="container">
    <div class="section" style="margin-bottom: 24px;">
      <div class="section-head">
        <h2>Financial Reports</h2>
        <span class="total-pill" id="reportCount">0 Reports</span>
      </div>
      <p class="hint" style="margin-bottom: 0;">Generated by admins — viewable by both admins and operators.</p>

      <div class="filter-bar">
        <button type="button" class="filter-btn active" onclick="setFilter('all', this)">All</button>
        <button type="button" class="filter-btn" onclick="setFilter('event', this)">Event</button>
        <button type="button" class="filter-btn" onclick="setFilter('monthly', this)">Monthly</button>
        <button type="button" class="filter-btn" onclick="setFilter('quarterly', this)">Quarterly</button>
        <button type="button" class="filter-btn" onclick="setFilter('half_yearly', this)">Half-Yearly</button>
        <button type="button" class="filter-btn" onclick="setFilter('yearly', this)">Yearly</button>
      </div>

      <div id="reportsMsg" class="message"></div>
    </div>

    <div id="reportsFeed"></div>
  </div>

  <script>
    const token = localStorage.getItem('token');
    const accessLevel = Number(localStorage.getItem('access_level'));
    const username = localStorage.getItem('username');

    if (!token) {
      window.location.href = '/index.html';
    }

    document.getElementById('userLabel').textContent = `${username} · L${accessLevel}`;
    document.getElementById('logoutBtn').addEventListener('click', logout);

    if (accessLevel === 1) {
      document.getElementById('uploadNavBtn').style.display = 'inline-block';
    }

    let allReports = [];
    let currentFilter = 'all';

    function logout() {
      localStorage.clear();
      window.location.href = '/index.html';
    }

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function formatRupees(val) {
      const num = Number(val || 0);
      const sign = num < 0 ? '-' : '';
      return sign + '₹' + Math.abs(num).toLocaleString('en-IN');
    }

    function formatDate(sqlDate) {
      if (!sqlDate) return '-';
      const d = new Date(sqlDate.replace(' ', 'T') + 'Z');
      return isNaN(d) ? sqlDate : d.toLocaleDateString('en-IN', {
        day: '2-digit',
        month: 'short',
        year: 'numeric',
      });
    }

    function prettyType(t) {
      const map = {
        event: 'Event Report',
        monthly: 'Monthly Report',
        quarterly: 'Quarterly Report',
        half_yearly: 'Half-Yearly Report',
        yearly: 'Yearly Report',
      };
      return map[t] || t;
    }

    function setFilter(type, btn) {
      currentFilter = type;
      document.querySelectorAll('.filter-btn').forEach((b) => b.classList.remove('active'));
      btn.classList.add('active');
      renderReports();
    }

    function renderDonationsTable(rows) {
      if (!rows || rows.length === 0) {
        return `<div class="table-wrap"><table><tbody><tr><td class="empty-row">No donations in this period.</td></tr></tbody></table></div>`;
      }

      return `
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Donation Category (Event)</th>
                <th>Entries</th>
                <th>Total Donated</th>
              </tr>
            </thead>
            <tbody>
              ${rows.map((r) => {
                const cls = r.category === 'General' ? 'event-tag-badge general' : 'event-tag-badge';
                return `
                  <tr>
                    <td><span class="${cls}">${escapeHtml(r.category)}</span></td>
                    <td>${r.count}</td>
                    <td class="amount-cell">${formatRupees(r.total)}</td>
                  </tr>
                `;
              }).join('')}
            </tbody>
          </table>
        </div>
      `;
    }

    // Renders each expense category with its subtotal AND every expense item under it
    function renderExpensesByCategory(groups, mode) {
      if (!groups || groups.length === 0) {
        return `<div class="table-wrap"><table><tbody><tr><td class="empty-row">No expenses recorded in this period.</td></tr></tbody></table></div>`;
      }

      const isByType = mode === 'type';

      return groups.map((g) => {
        const badgeClass = isByType
          ? 'type-tag-badge'
          : (g.category === 'General' ? 'event-tag-badge general' : 'event-tag-badge');

        const items = g.items || [];
        const itemsTable = items.length > 0
          ? `
            <div class="table-wrap" style="margin-top: 10px;">
              <table>
                <thead>
                  <tr>
                    <th>#</th>
                    <th>${isByType ? 'Event' : 'Type'}</th>
                    <th>Amount</th>
                    <th>Note</th>
                    <th>Date</th>
                  </tr>
                </thead>
                <tbody>
                  ${items.map((item) => {
                    const secondaryTag = isByType ? item.event_tag : item.type_tag;
                    const secClass = isByType
                      ? (secondaryTag === 'General' ? 'event-tag-badge general' : 'event-tag-badge')
                      : 'type-tag-badge';
                    return `
                      <tr>
                        <td><b>#${item.id}</b></td>
                        <td><span class="${secClass}">${escapeHtml(secondaryTag)}</span></td>
                        <td class="expense-cell">${formatRupees(item.amount)}</td>
                        <td>${escapeHtml(item.note || '—')}</td>
                        <td>${formatDate(item.created_at)}</td>
                      </tr>
                    `;
                  }).join('')}
                </tbody>
              </table>
            </div>
          `
          : '';

        return `
          <div class="category-expense-group">
            <div class="category-group-head">
              <div>
                <span class="${badgeClass}">${escapeHtml(g.category)}</span>
                <span class="stat-sub" style="margin-left: 8px;">${g.count} expense(s)</span>
              </div>
              <span class="category-group-total">Category Total: ${formatRupees(g.total)}</span>
            </div>
            ${itemsTable}
          </div>
        `;
      }).join('');
    }

    function renderReports() {
      const feed = document.getElementById('reportsFeed');
      const countEl = document.getElementById('reportCount');

      const filtered = currentFilter === 'all'
        ? allReports
        : allReports.filter((r) => r.report_type === currentFilter);

      countEl.textContent = `${filtered.length} ${filtered.length === 1 ? 'Report' : 'Reports'}`;

      if (filtered.length === 0) {
        feed.innerHTML = `
          <div class="section welcome-box">
            <h2>No Reports Found</h2>
            <p class="hint" style="margin-bottom: 0;">
              ${accessLevel === 1
                ? 'Generate a report from your Dashboard to see it here.'
                : 'No reports have been generated for this category yet.'}
            </p>
          </div>
        `;
        return;
      }

      feed.innerHTML = filtered.map((rep) => {
        const s = rep.summary || {};
        const deleteBtn = accessLevel === 1
          ? `<button class="btn-reject" onclick="deleteReport(${rep.id})">Delete</button>`
          : '';
        const manualSub = s.manual_donations_total > 0
          ? `Includes ${formatRupees(s.manual_donations_total)} offline/admin-recorded`
          : `${s.donation_count || 0} donation(s)`;

        return `
          <article class="report-card">
            <div class="event-header">
              <div>
                <h2 class="event-title">${escapeHtml(rep.title)}</h2>
                <div class="event-meta">
                  <span class="report-type-pill">${escapeHtml(prettyType(rep.report_type))}</span>
                  <span class="meta-tag date-tag">${escapeHtml(rep.period_label)}</span>
                  <span class="meta-tag">By ${escapeHtml(rep.generated_by)} · ${formatDate(rep.created_at)}</span>
                </div>
              </div>
              ${deleteBtn}
            </div>

            <div class="report-stats">
              <div class="stat-box donations">
                <div class="stat-label">Total Donations</div>
                <div class="stat-value">${formatRupees(s.total_donations)}</div>
                <div class="stat-sub">${manualSub}</div>
              </div>
              <div class="stat-box expenses">
                <div class="stat-label">Total Expenses</div>
                <div class="stat-value">${formatRupees(s.total_expenses)}</div>
                <div class="stat-sub">${s.expense_count || 0} expense(s)</div>
              </div>
              <div class="stat-box net">
                <div class="stat-label">Net Balance</div>
                <div class="stat-value">${formatRupees(s.net_balance)}</div>
                <div class="stat-sub">Donations minus Expenses</div>
              </div>
            </div>

            <div class="report-block">
              <h3 class="report-subhead">Total Donations Under Each Category (Event)</h3>
              ${renderDonationsTable(s.donations_by_category)}
            </div>

            <div class="report-block">
              <h3 class="report-subhead">Expenses Under Each Type Category</h3>
              ${renderExpensesByCategory(s.expenses_by_type, 'type')}
            </div>

            <div class="report-block">
              <h3 class="report-subhead">Expenses Under Each Event Category</h3>
              ${renderExpensesByCategory(s.expenses_by_event, 'event')}
            </div>
          </article>
        `;
      }).join('');
    }

    async function loadReports() {
      const msg = document.getElementById('reportsMsg');
      msg.className = 'message';

      try {
        const res = await fetch('/api/reports', {
          headers: { Authorization: `Bearer ${token}` },
        });

        if (res.status === 401) return logout();
        const data = await res.json();

        if (!res.ok) {
          msg.textContent = data.error || 'Could not load reports';
          msg.className = 'message error';
          return;
        }

        allReports = data.reports || [];
        renderReports();
      } catch {
        msg.textContent = 'Could not connect to server.';
        msg.className = 'message error';
      }
    }

    async function deleteReport(id) {
      if (!confirm('Delete this generated report?')) return;
      const res = await fetch(`/api/reports/${id}`, {
        method: 'DELETE',
        headers: { Authorization: `Bearer ${token}` },
      });
      if (res.status === 401) return logout();
      loadReports();
    }

    loadReports();
  </script>
  <script src="nav.js"></script>
</body>
</html>
