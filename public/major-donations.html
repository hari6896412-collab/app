<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Major Donations</title>
  <link rel="stylesheet" href="/style.css" />
  <script src="/theme.js"></script>
</head>
<body>
  <header></header>

  <div class="container">
    <div class="section">
      <div class="section-head">
        <h2 id="majorTitle">Major Donations</h2>
        <span class="total-pill" id="majorTotal">Total: ₹0</span>
      </div>
      <p class="hint" id="majorHint">Showing all contributions above the lower limit.</p>

      <div class="pdf-settings" style="margin-top: 4px;">
        <div>
          <label for="centreFilter">Centre</label>
          <select id="centreFilter" style="min-width: 240px;"></select>
        </div>
        <form id="limitForm" style="display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap;" hidden>
          <div>
            <label for="minAmount">Major-donation limit for this centre (₹)</label>
            <input type="number" id="minAmount" class="pdf-amount" min="0" step="1" required />
          </div>
          <button type="submit">Save limit</button>
        </form>
      </div>
      <div id="majorMsg" class="message"></div>

      <div class="table-wrap" style="margin-top: 16px;">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Donor</th>
              <th>Centre</th>
              <th>Event / Cause</th>
              <th>Amount</th>
              <th>Note</th>
              <th>Date</th>
            </tr>
          </thead>
          <tbody id="majorTableBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="/access.js"></script>
  <script>
    const token = localStorage.getItem('token');

    if (!token) {
      window.location.href = '/index.html';
    }

    let donations = [];
    let centres = [];
    let myCentreId = null;
    let firstLoad = true;

    function logout() {
      localStorage.clear();
      window.location.href = '/index.html';
    }

    function escapeHtml(str) {
      return String(str ?? '-')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function formatRupees(val) {
      return '₹' + Number(val || 0).toLocaleString('en-IN');
    }

    function formatDate(sqlDate) {
      if (!sqlDate) return '-';
      const d = new Date(sqlDate.replace(' ', 'T') + 'Z');
      return isNaN(d) ? sqlDate : d.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
    }

    function showMsg(text, kind) {
      const msg = document.getElementById('majorMsg');
      msg.textContent = text;
      msg.className = `message ${kind || ''}`;
    }

    function selectedCentre() {
      const v = document.getElementById('centreFilter').value;
      return v === 'all' ? null : centres.find((c) => String(c.id) === v) || null;
    }

    function render() {
      const tbody = document.getElementById('majorTableBody');
      const centre = selectedCentre();
      const total = donations.reduce((sum, d) => sum + d.amount, 0);

      document.getElementById('majorTotal').textContent = `Total: ${formatRupees(total)}`;
      document.getElementById('majorTitle').textContent = centre
        ? `Major Donations · ${centre.name}`
        : 'Major Donations · All centres';
      document.getElementById('majorHint').textContent = centre
        ? `${donations.length} donation${donations.length === 1 ? '' : 's'} above ${formatRupees(centre.major_donation_min)}, the limit set for ${centre.name}.`
        : `${donations.length} donation${donations.length === 1 ? '' : 's'}, each above its own centre's limit.`;

      const form = document.getElementById('limitForm');
      form.hidden = !(centre && centre.can_edit);
      if (centre) document.getElementById('minAmount').value = centre.major_donation_min;

      if (donations.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="empty-row">No major donations ${centre ? `for ${escapeHtml(centre.name)}` : ''} yet.</td></tr>`;
        return;
      }

      tbody.innerHTML = donations.map((d) => {
        const tag = d.event_tag || 'General';
        const tagClass = tag === 'General' ? 'event-tag-badge general' : 'event-tag-badge';
        const offlinePill = d.is_manual ? `<span class="manual-badge">Admin Entry</span>` : '';
        return `
          <tr>
            <td><b>#${d.id}</b></td>
            <td>${escapeHtml(d.username)}</td>
            <td>${escapeHtml(d.centre_name || '—')}<div class="stat-sub">limit ${formatRupees(d.major_donation_min)}</div></td>
            <td><span class="${tagClass}">${escapeHtml(tag)}</span></td>
            <td class="amount-cell">${formatRupees(d.amount)}${offlinePill}</td>
            <td>${escapeHtml(d.note || '—')}</td>
            <td>${formatDate(d.created_at)}</td>
          </tr>
        `;
      }).join('');
    }

    async function loadMajorDonations() {
      showMsg('', '');
      const sel = document.getElementById('centreFilter');
      const chosen = sel.value && sel.value !== 'all' ? `?centre_id=${encodeURIComponent(sel.value)}` : '';
      try {
        const res = await fetch(`/api/donations/major${firstLoad ? '' : chosen}`, {
          headers: { Authorization: `Bearer ${token}` },
        });
        if (res.status === 401) return logout();
        const data = await res.json();
        if (!res.ok) {
          showMsg(data.error || 'Could not load major donations', 'error');
          return;
        }

        centres = data.centres || [];
        myCentreId = data.my_centre_id;

        if (firstLoad) {
          // Build the centre list once, then open the member's own centre
          sel.innerHTML = '<option value="all">All centres</option>' +
            window.Access.centreOptionsHtml(centres.map((c) => ({ ...c, name: `${c.name} (limit ${formatRupees(c.major_donation_min)})` })));
          firstLoad = false;
          if (myCentreId && centres.some((c) => c.id === myCentreId)) {
            sel.value = String(myCentreId);
            return loadMajorDonations();
          }
        }

        donations = data.donations || [];
        render();
      } catch {
        showMsg('Could not connect to server.', 'error');
      }
    }

    document.getElementById('centreFilter').addEventListener('change', loadMajorDonations);

    // Admins of a centre (and the admins above them) set that centre's limit
    document.getElementById('limitForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const centre = selectedCentre();
      if (!centre) return;
      const value = Number(document.getElementById('minAmount').value);
      if (!Number.isFinite(value) || value < 0) {
        showMsg('Enter an amount of 0 or more.', 'error');
        return;
      }
      const res = await fetch(`/api/centres/${centre.id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
        body: JSON.stringify({ major_donation_min: value }),
      });
      if (res.status === 401) return logout();
      const data = await res.json();
      if (!res.ok) {
        showMsg(data.error || 'Could not save', 'error');
        return;
      }
      const keep = centre.id;
      firstLoad = true;
      await loadMajorDonations();
      document.getElementById('centreFilter').value = String(keep);
      await loadMajorDonations();
      showMsg(`${centre.name}'s major-donation limit is now ${formatRupees(value)}.`, 'success');
    });

    loadMajorDonations();
  </script>
  <script src="/nav.js"></script>
</body>
</html>
